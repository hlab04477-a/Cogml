<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<!-- กันซูมมือถือ -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Click Game</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0b2e13;
font-family:Arial;
color:white;
touch-action: manipulation;
}

.box{
text-align:center;
background:#0f3d1f;
padding:30px;
border-radius:15px;
width:300px;
box-shadow:0 0 20px rgba(0,255,100,0.2);
}

button{
font-size:20px;
padding:15px 30px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00c853;
color:white;
margin-top:15px;
touch-action: manipulation;
}

button:active{
transform:scale(0.95);
}

.count{
font-size:24px;
margin-top:10px;
}

.result{
margin-top:15px;
font-size:20px;
color:#ffd54f;
}

.warn{
margin-top:10px;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h2>เกมกดปุ่ม</h2>

<div class="count">จำนวนครั้ง: <span id="c">0</span></div>

<button id="btn" onclick="addClick()">กดเลย</button>

<div class="result" id="r"></div>
<div class="warn" id="w"></div>
</div>

<script>
let count = 0;
let lastClick = 0;
let clicks = [];
let blocked = false;

function addClick(){
if(blocked) return;

let now = Date.now();

// กันกดรัวผิดธรรมชาติ
if(now - lastClick < 40){
return cheat();
}
lastClick = now;

// เก็บ pattern
clicks.push(now);
if(clicks.length > 8) clicks.shift();

// ตรวจ pattern ออโต้คลิกแบบเบา
if(clicks.length === 8){
let diffs = [];
for(let i=1;i<clicks.length;i++){
diffs.push(clicks[i] - clicks[i-1]);
}

let avg = diffs.reduce((a,b)=>a+b)/diffs.length;
let variance = diffs.reduce((a,b)=>a+Math.abs(b-avg),0)/diffs.length;

// ถ้าเร็ว + เป๊ะเกินไป
if(avg < 55 && variance < 5){
return cheat();
}
}

count++;
document.getElementById("c").innerText = count;

if(count === 500){
document.getElementById("r").innerText = "ได้รับ 50 ทรูมันนี่";
}
}

function cheat(){
blocked = true;
document.getElementById("w").innerText = "ห้ามใช้ออโต้คลิกนะครับ";
document.getElementById("btn").disabled = true;
}
</script>

</body>
</html>
