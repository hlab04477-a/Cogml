  <!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Terminal</title>

<style>
body{
    margin:0;
    background:#000;
    color:#00ff66;
    font-family:Consolas,monospace;
    overflow:hidden;
}

#home{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    padding:18px 40px;
    font-size:22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#terminal{
    display:none;
    height:100vh;
    padding:15px;
    box-sizing:border-box;
    overflow:auto;
}

#text{
    white-space:pre-line;
    font-size:15px;
}

.watermark{
    position:fixed;
    top:10px;
    right:15px;
    opacity:.25;
    font-size:12px;
}

.scan{
    position:fixed;
    left:0;
    width:100%;
    height:2px;
    background:#00ff66;
    box-shadow:0 0 15px #00ff66;
    animation:scan 2s linear infinite;
}

@keyframes scan{
    from{top:0;}
    to{top:100%;}
}

.bar{
    width:100%;
    max-width:500px;
    height:18px;
    border:1px solid #00ff66;
    margin-top:15px;
}

.fill{
    width:0%;
    height:100%;
    background:#00ff66;
    transition:2s linear;
}
</style>
</head>

<body>

<div id="home">
    <button onclick="start()">ENTER</button>
</div>

<div id="terminal">
    <div class="scan"></div>
    <div class="watermark">CYBER TERMINAL v1.0</div>

    <div id="text"></div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>
</div>

<script>
function start(){

    document.getElementById("home").style.display="none";
    document.getElementById("terminal").style.display="block";

    setTimeout(()=>{
        document.getElementById("fill").style.width="100%";
    },100);

    const lines=[
    "INITIALIZING SYSTEM...",
    "LOADING CORE MODULES...",
    "LOADING GRAPHICS ENGINE...",
    "LOADING NETWORK STACK...",
    "CHECKING MEMORY...",
    "CHECKING CPU...",
    "CHECKING STORAGE...",
    "VERIFYING FILE SYSTEM...",
    "ESTABLISHING CONNECTION...",
    "SYNCING DATABASE...",
    "UPDATING CACHE...",
    "LOADING USER PROFILE...",
    "LOADING SECURITY MODULE...",
    "LOADING TERMINAL SERVICES...",
    "STARTING BACKGROUND TASKS...",
    "INITIALIZING LOGGING SERVICE...",
    "INITIALIZING EVENT MONITOR...",
    "INITIALIZING KERNEL INTERFACE...",
    "LOADING DRIVERS...",
    "LOADING EXTENSIONS...",
    "LOADING CONFIGURATION...",
    "CHECKING DEPENDENCIES...",
    "PREPARING ENVIRONMENT...",
    "RUNNING SELF TEST...",
    "SELF TEST PASSED",
    "LOADING VISUAL COMPONENTS...",
    "RENDERING INTERFACE...",
    "CONNECTING TO NODE 01...",
    "CONNECTING TO NODE 02...",
    "CONNECTING TO NODE 03...",
    "CONNECTION ESTABLISHED",
    "DOWNLOADING STATUS DATA...",
    "PROCESSING INFORMATION...",
    "ANALYZING SYSTEM STATE...",
    "OPTIMIZING PERFORMANCE...",
    "FINALIZING STARTUP...",
    "",
    "██████████████████████████████ 100%",
    "",
    "SYSTEM READY",
    "TERMINAL ONLINE",
    "ACCESS LEVEL: USER",
    "SESSION ACTIVE",
    "",
    "WELCOME TO CYBER TERMINAL"
    ];

    let i=0;

    function type(){
        if(i < lines.length){
            document.getElementById("text").innerHTML += lines[i] + "\n";
            document.getElementById("terminal").scrollTop =
                document.getElementById("terminal").scrollHeight;

            i++;
            setTimeout(type,40);
        }
    }

    type();
}
</script>

</body>
</html>
