<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COC NCC Percent System</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#000,#111,#000);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* container */
.container{
  width:360px;
  background:#0f0f0f;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
  box-shadow:0 0 25px rgba(255,255,255,0.05);
  text-align:center;
}

/* header */
.header{
  font-size:20px;
  letter-spacing:3px;
  margin-bottom:15px;
}

/* input */
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #444;
  background:#000;
  color:white;
  text-align:center;
  font-size:15px;
}

/* button */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  background:#ccc;
}

/* result */
.result{
  margin-top:15px;
  font-size:18px;
  color:#00ffcc;
}

/* footer creator */
.creator{
  margin-top:20px;
  font-size:13px;
  letter-spacing:3px;
  color:white;
  animation:blink 1s infinite;
}

/* blink animation */
@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.1;}
  100%{opacity:1;}
}

/* glow effect */
.glow{
  text-shadow:0 0 10px #fff,0 0 20px #aaa;
}
</style>
</head>

<body>

<div class="container">
  <div class="header glow">PERCENT SYSTEM</div>

  <input type="number" id="amount" placeholder="ยอดเงิน (เช่น 1000)">
  <input type="number" id="percent" placeholder="เปอร์เซ็นต์ (เช่น 10)">

  <button onclick="calc()">คำนวณ</button>

  <div class="result" id="result">กรอกข้อมูลเพื่อคำนวณ</div>

  <div class="creator">COC NCC</div>
</div>

<script>
function calc(){
  let amount = parseFloat(document.getElementById("amount").value);
  let percent = parseFloat(document.getElementById("percent").value);

  if(isNaN(amount) || isNaN(percent)){
    document.getElementById("result").innerHTML = "⚠️ กรุณากรอกข้อมูลให้ครบ";
    return;
  }

  let total = amount * (percent / 100);

  document.getElementById("result").innerHTML =
    "💰 ได้ทั้งหมด: " + total.toFixed(2) + " บาท";
}
</script>

</body>
